name: Daily UAT — Buoy Champ

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 09:00 BRT (UTC-3) Mon–Fri
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  run-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      UAT_PORT: 8080
      UAT_ENV: dev             # dev | uat | prod
      UAT_USERS: 5             # concurrent users
      UAT_SUITE_NAME: "Business Owner Onboarding"

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Playwright browsers ────────────────────────────
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 5. Start UAT server in background ────────────────────────
      - name: Start UAT server
        run: |
          uvicorn app.main:app --port $UAT_PORT &
          # wait for server to be ready
          for i in $(seq 1 20); do
            curl -sf http://localhost:$UAT_PORT/ && break
            sleep 2
          done

      # ── 6. Suite ID — always 1 (auto-seeded on app boot) ─────────────
      - name: Set suite ID
        id: suite
        run: |
          echo "id=1" >> $GITHUB_OUTPUT
          echo "Suite ID: 1 (Business Owner Onboarding)"

      # ── 7. Trigger the UAT run ────────────────────────────────────
      - name: Trigger UAT run
        id: trigger
        run: |
          # Single POST — capture Location header to get run ID
          RUN_ID=$(curl -s -X POST \
            "http://localhost:$UAT_PORT/suites/${{ steps.suite.outputs.id }}/run" \
            -d "env=$UAT_ENV&num_users=$UAT_USERS&notes=CI+daily+run" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -D - -o /dev/null \
            --max-redirs 0 2>/dev/null \
            | grep -i "^location:" | grep -oP '\d+' | tail -1)
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not determine run ID from redirect" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered run #$RUN_ID"

      # ── 8. Poll until run completes ───────────────────────────────
      - name: Wait for run to complete
        id: wait
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          echo "Polling run #$RUN_ID..."
          for i in $(seq 1 150); do  # poll up to 25 min (150 × 10s)
            STATUS=$(curl -sf "http://localhost:$UAT_PORT/runs/$RUN_ID/status" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))")
            echo "  [${i}] status=$STATUS"
            if [[ "$STATUS" == "complete" || "$STATUS" == "error" || "$STATUS" == "canceled" ]]; then
              echo "final_status=$STATUS" >> $GITHUB_OUTPUT
              break
            fi
            sleep 10
          done

      # ── 9. Download JSON report ───────────────────────────────────
      - name: Download run report
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          curl -sf "http://localhost:$UAT_PORT/runs/$RUN_ID/export" \
            -o "run_${RUN_ID}.json"
          echo "Report saved: run_${RUN_ID}.json"
          python3 -c "
          import json, sys
          with open('run_$RUN_ID.json') as f:
            d = json.load(f)
          s = d.get('summary', {})
          print(f\"Summary: {s.get('users_pass')} pass / {s.get('users_warn')} warn / {s.get('users_fail')} fail\")
          "

      # ── 10. Upload artifact ───────────────────────────────────────
      - name: Upload run report artifact
        uses: actions/upload-artifact@v4
        with:
          name: uat-report-run-${{ steps.trigger.outputs.run_id }}
          path: "run_${{ steps.trigger.outputs.run_id }}.json"
          retention-days: 30

      # ── 11. Notify Slack ─────────────────────────────────────────
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
          FINAL: ${{ steps.wait.outputs.final_status }}
          UAT_ENV: ${{ env.UAT_ENV }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          run_id  = os.environ.get("RUN_ID", "?")
          final   = os.environ.get("FINAL", "unknown")
          webhook = os.environ.get("SLACK_WEBHOOK", "")
          env     = os.environ.get("UAT_ENV", "dev")
          repo    = os.environ.get("GITHUB_REPOSITORY", "")
          srv     = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          gh_run  = os.environ.get("GITHUB_RUN_ID", "")

          emoji = "✅" if final == "complete" else "❌"
          color = "good" if final == "complete" else "danger"
          logs_url = f"{srv}/{repo}/actions/runs/{gh_run}"

          try:
            with open(f"run_{run_id}.json") as f:
              data = json.load(f)
          except Exception:
            data = {}

          s = data.get("summary", {})
          total   = s.get("total_users", 0)
          passed  = s.get("users_pass", 0)
          warned  = s.get("users_warn", 0)
          failed  = s.get("users_fail", 0)
          elapsed = s.get("wall_time_sec", "?")

          # Build step table
          users = data.get("users", [])
          step_names = s.get("canonical_step_order", [])
          step_stats = {}
          for step in step_names:
            step_stats[step] = {"pass": 0, "warn": 0, "fail": 0, "skip": 0}
          for u in users:
            for st in u.get("steps", []):
              name = st["name"]
              status = st.get("status", "SKIP").lower()
              if name in step_stats and status in step_stats[name]:
                step_stats[name][status] += 1

          # Shorten step names
          short = {
            "Onboarding 1": "O1 — Intro",
            "Onboarding 2": "O2 — User Type",
            "Onboarding 3": "O3 — Company Info",
            "Onboarding 4": "O4 — Census & Payroll",
            "Onboarding 5": "O5 — Impact Estimate",
            "Sign Up":      "Sign Up",
            "OTP":          "OTP — Verify",
            "Enrollment 1": "E1 — Account Manager",
            "Enrollment 2": "E2 — Company Info",
            "Enrollment 3B":"E3B — Persona KYB",
            "Enrollment 3C":"E3C — Payroll + LOI",
            "Enrollment 4": "E4 — Final Report",
            "Enrollment 5": "E5 — PandaDoc",
          }

          rows = []
          for full, st in step_stats.items():
            label = next((v for k, v in short.items() if full.startswith(k)), full[:30])
            icons = []
            if st["fail"] > 0:  icons.append(f"🔴 {st['fail']} fail")
            if st["warn"] > 0:  icons.append(f"🟡 {st['warn']} warn")
            if st["pass"] == total and total > 0: icons.append("✅")
            rows.append(f"`{label:<25}` {'  '.join(icons) if icons else '—'}")

          step_block = "\n".join(rows) if rows else "(no step data)"

          payload = {
            "text": f"{emoji} *BerTech UAT — Daily Run #{run_id}* | {final}",
            "attachments": [{
              "color": color,
              "fields": [
                {"title": "Environment", "value": env, "short": True},
                {"title": "Users", "value": f"{passed} pass · {warned} warn · {failed} fail  |  {elapsed}s", "short": True},
                {"title": "Step Breakdown", "value": step_block, "short": False},
                {"title": "Logs", "value": f"<{logs_url}|View workflow run>", "short": False},
              ]
            }]
          }

          body = json.dumps(payload).encode()
          req  = urllib.request.Request(webhook, data=body, headers={"Content-Type": "application/json"})
          try:
            urllib.request.urlopen(req, timeout=10)
            print("Slack notified OK")
          except Exception as e:
            print(f"Slack notify failed: {e}")
          PYEOF

      # ── 12. Fail job if UAT errored ───────────────────────────────
      - name: Assert run succeeded
        run: |
          STATUS=${{ steps.wait.outputs.final_status }}
          if [[ "$STATUS" == "error" ]]; then
            echo "UAT run ended with status=error"
            exit 1
          fi
          echo "UAT run finished: $STATUS"
