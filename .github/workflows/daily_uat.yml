name: Daily UAT — Buoy Champ

on:
  schedule:
    - cron: "0 9 * * 1-5"   # 09:00 UTC Mon–Fri  (adjust to your timezone)
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  run-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UAT_PORT: 8080
      UAT_ENV: dev             # dev | uat | prod
      UAT_USERS: 1             # number of concurrent users
      UAT_SUITE_NAME: "Business Owner Onboarding"

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Playwright browsers ────────────────────────────
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 5. Start UAT server in background ────────────────────────
      - name: Start UAT server
        run: |
          uvicorn app.main:app --port $UAT_PORT &
          # wait for server to be ready
          for i in $(seq 1 20); do
            curl -sf http://localhost:$UAT_PORT/ && break
            sleep 2
          done

      # ── 6. Get or create suite ID ─────────────────────────────────
      - name: Resolve suite ID
        id: suite
        run: |
          SUITES=$(curl -sf http://localhost:$UAT_PORT/suites/api 2>/dev/null || echo "[]")
          SUITE_ID=$(echo "$SUITES" | python3 -c "
          import sys, json
          suites = json.load(sys.stdin)
          name = '$UAT_SUITE_NAME'
          match = next((s for s in suites if s['name'] == name), None)
          print(match['id'] if match else '')
          ")
          if [ -z "$SUITE_ID" ]; then
            echo "Suite '$UAT_SUITE_NAME' not found. Available suites:" >&2
            echo "$SUITES" | python3 -c "import sys,json; [print(f\"  #{s['id']}: {s['name']}\") for s in json.load(sys.stdin)]" >&2
            exit 1
          fi
          echo "id=$SUITE_ID" >> $GITHUB_OUTPUT
          echo "Found suite #$SUITE_ID: $UAT_SUITE_NAME"

      # ── 7. Trigger the UAT run ────────────────────────────────────
      - name: Trigger UAT run
        id: trigger
        run: |
          RESPONSE=$(curl -sf -X POST \
            "http://localhost:$UAT_PORT/suites/${{ steps.suite.outputs.id }}/run" \
            -d "env=$UAT_ENV&num_users=$UAT_USERS&notes=CI+daily+run" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -w "\n%{http_code}" \
            --max-redirs 0 -o /dev/null || true)
          # Extract run ID from the redirect Location header
          RUN_ID=$(curl -sf -X POST \
            "http://localhost:$UAT_PORT/suites/${{ steps.suite.outputs.id }}/run" \
            -d "env=$UAT_ENV&num_users=$UAT_USERS&notes=CI+daily+run" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -D - -o /dev/null 2>/dev/null \
            | grep -i "^location:" | grep -oP '\d+' | tail -1)
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered run #$RUN_ID"

      # ── 8. Poll until run completes ───────────────────────────────
      - name: Wait for run to complete
        id: wait
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          echo "Polling run #$RUN_ID..."
          for i in $(seq 1 90); do   # poll up to 15 min (90 × 10s)
            STATUS=$(curl -sf "http://localhost:$UAT_PORT/runs/$RUN_ID/status" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))")
            echo "  [${i}] status=$STATUS"
            if [[ "$STATUS" == "complete" || "$STATUS" == "error" || "$STATUS" == "canceled" ]]; then
              echo "final_status=$STATUS" >> $GITHUB_OUTPUT
              break
            fi
            sleep 10
          done

      # ── 9. Download JSON report ───────────────────────────────────
      - name: Download run report
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          curl -sf "http://localhost:$UAT_PORT/runs/$RUN_ID/export" \
            -o "run_${RUN_ID}.json"
          echo "Report saved: run_${RUN_ID}.json"
          python3 -c "
          import json, sys
          with open('run_$RUN_ID.json') as f:
            d = json.load(f)
          s = d.get('summary', {})
          print(f\"Summary: {s.get('users_pass')} pass / {s.get('users_warn')} warn / {s.get('users_fail')} fail\")
          "

      # ── 10. Upload artifact ───────────────────────────────────────
      - name: Upload run report artifact
        uses: actions/upload-artifact@v4
        with:
          name: uat-report-run-${{ steps.trigger.outputs.run_id }}
          path: "run_${{ steps.trigger.outputs.run_id }}.json"
          retention-days: 30

      # ── 11. Notify Slack ─────────────────────────────────────────
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          FINAL=${{ steps.wait.outputs.final_status }}
          EMOJI="✅"
          if [[ "$FINAL" == "error" ]]; then EMOJI="❌"; fi

          SUMMARY=$(python3 -c "
          import json
          try:
            with open('run_${RUN_ID}.json') as f:
              d = json.load(f)
            s = d.get('summary', {})
            print(f\"{s.get('users_pass',0)} pass · {s.get('users_warn',0)} warn · {s.get('users_fail',0)} fail · {s.get('wall_time_sec','?')}s\")
          except:
            print('(report unavailable)')
          " 2>/dev/null || echo "(report unavailable)")

          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"$EMOJI *BerTech UAT — Daily Run #${RUN_ID}* | $FINAL\",
              \"attachments\": [{
                \"color\": \"$([ '$FINAL' = 'complete' ] && echo 'good' || echo 'danger')\",
                \"fields\": [
                  {\"title\": \"Environment\", \"value\": \"$UAT_ENV\", \"short\": true},
                  {\"title\": \"Results\", \"value\": \"$SUMMARY\", \"short\": true},
                  {\"title\": \"Workflow\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>\", \"short\": true}
                ]
              }]
            }"

      # ── 12. Fail job if UAT errored ───────────────────────────────
      - name: Assert run succeeded
        run: |
          STATUS=${{ steps.wait.outputs.final_status }}
          if [[ "$STATUS" == "error" ]]; then
            echo "UAT run ended with status=error"
            exit 1
          fi
          echo "UAT run finished: $STATUS"
